[project]
name = "fujielab-asr"
version = "0.5.1"
description = "Streaming Automatic Speech Recognition (ASR) tools for Fujie Lab, built on ESPnet"
readme = "README.md"
requires-python = ">=3.10, <3.13"
authors = [
    {name = "Shinya Fujie", email = "shinya.fujie@p.chibakoudai.jp"}]
maintainers = [
    {name = "Shinya Fujie", email = "shinya.fujie@p.chibakoudai.jp"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "asr",
    "speech-recognition",
    "espnet",
    "streaming",
    "transducer",
    "ctc",
    "zipformer",
    "japanese",
    "disfluency",
    "filler",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Japanese",
]
dependencies = [
    "espnet>=202412",
    "espnet_model_zoo",
    "torchaudio",
]

[project.optional-dependencies]
# Whisper large-v3 + LoRA models (fujielab/espnet_asr_csj_cejc_pron_*_whisper_*)
whisper = [
    "openai-whisper>=20240930",
    "loralib>=0.1.2",
]
# Streaming Zipformer models run by sherpa-onnx (fujielab/sherpa_onnx_asr_*); CPU real time, no torch at inference
sherpa = [
    "sherpa-onnx>=1.10",
    "huggingface_hub",
    "numpy",
]
# Two-layer Cascade Zipformer models run as TorchScript (fujielab/icefall_asr_*_cascade_*); CPU real time
cascade = [
    "torch>=2.6",  # model.pt was exported with torch 2.7.1; 2.6 gives identical output
    "kaldi-native-fbank>=1.20",
    "huggingface_hub",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/fujielab/fujielab-asr"
Repository = "https://github.com/fujielab/fujielab-asr"
Issues = "https://github.com/fujielab/fujielab-asr/issues"

[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["data", "examples"]
